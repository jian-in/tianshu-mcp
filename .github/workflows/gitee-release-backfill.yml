# 补建 Gitee 发行版（镜像仓库补齐）
#
# 为什么需要它：Gitee 发行版由 release.yml 的「Create/Update Gitee release」步骤创建，
# 该步骤用的是仓库 Secrets 里的 `GITEE_TOKEN`（本地终端读不到 Secret，所以没法用脚本补）。
# 当某次 release.yml 因其它门禁失败（例如目标 commit 的 CI 未通过）时，
# GitHub 发行版可以事后手动补、Gitee 发行版却只能再由 CI 跑一次 —— 而 release.yml 的
# `workflow_dispatch` 会校验 `inputs.version == package.json.version`，无法回头补历史版本。
#
# 本 workflow 只做一件事：调用既有的 scripts/gitee-release.mjs 幂等创建/更新指定 tag 的发行版。
# 它对 GitHub 侧零副作用（不建 tag、不动 release），只写 Gitee。
#
# 用法：Actions → Gitee Release Backfill → Run workflow，填 version（如 0.7.1）与 previousVersion（如 0.6.7）。
name: Gitee Release Backfill

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要补建的版本号（不带 v 前缀，如 0.7.1；对应 tag v<version>）"
        required: true
      previousVersion:
        description: "上一版本（用于生成 Full Changelog 比较链接，如 0.6.7）"
        required: false

permissions:
  contents: read

jobs:
  backfill:
    name: Create/Update Gitee release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整 tag 历史：发布说明里会引用 tag 链接
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 与 release.yml 同一条凭据契约：缺 token 就明确失败，而不是静默跳过
      - name: Require mirror release credentials
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          test -n "$GITEE_ACCESS_TOKEN" || {
            echo "GITEE_TOKEN is required（仓库 Settings → Secrets → Actions 中配置）"
            exit 1
          }

      - name: Verify version has a release body doc
        run: |
          V="${{ inputs.version }}"
          for f in "docs/release-v${V}.md" "docs/release-v${V}.en.md"; do
            test -f "$f" || { echo "缺少发布说明文档：$f"; exit 1; }
          done
          echo "发布说明文档齐备"

      - name: Create/Update Gitee release (mirror)
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          node scripts/gitee-release.mjs "${{ inputs.version }}" "${{ inputs.previousVersion }}"
