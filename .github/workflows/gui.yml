name: GUI

# Tianshu-mcp 日志台（mcp-gui/）的构建、门禁与双端发行版发布（issue #25）。
#
# 刻意**独立于** ci.yml / release.yml：
#   - 不碰 MCP 主包的测试与发版链路，避免「GUI 发版影响 MCP 发版」；
#   - tag 形如 `gui-v0.1.0-beta.1`，**不以 `v` 开头**，因此不会命中 release.yml 的 `v*`。
#
# 触发与变更过滤（注意：push 上**不写 `paths`**）：
#   - `push.paths` 与 `push.tags` 同时存在时，tag 推送可能根本不触发工作流（首次发版会空跑）；
#     因此变更过滤统一交给 `schema-parity` 里的 `changed` 步骤：
#       · push tag `gui-v*` → **无条件构建** + 签名 + 双端发行版 + 更新清单
#         （正式版 / 预发布按 tag 形态分流：含 `-beta.` / `-rc.` 即 pre-release）；
#       · `workflow_dispatch`（手动） → **无条件构建**；
#       · push 到 master/main、PR → 只有真的改了 `mcp-gui/**`、两个词表真源或 `gui.yml` 自身才构建（省 runner）。

on:
  push:
    branches: [master, main]
    tags:
      # 正式版与预发布共用同一条流水线：`gui-v0.1.0` / `gui-v0.1.0-beta.9` / `gui-v0.1.0-rc.1` 都触发。
      # 是否标为 pre-release 由 publish 阶段按 tag 形态判定（见 `Decide pre-release` 步骤）。
      - "gui-v*"
  pull_request:
    branches: [master, main]
    paths:
      - "mcp-gui/**"
      - ".github/workflows/gui.yml"
  workflow_dispatch:

permissions:
  contents: write

# 注意：`with:` 不接受 `env` 上下文，故 Node 版本在下面直接使用字面量（与 ci.yml 保持一致为 22）。
jobs:
  schema-parity:
    name: Schema parity (TS ↔ frontend ↔ Rust)
    runs-on: ubuntu-latest
    outputs:
      gui_changed: ${{ steps.changed.outputs.gui_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 三份词表（TS 真源 / 前端镜像 / Rust 镜像）任一漂移即失败
      - name: Check TS ↔ frontend ↔ Rust schema parity
        run: node mcp-gui/scripts/check-schema-parity.mjs

      # GUI tag 必须不命中 MCP 的 release.yml（触发条件为 tags: v*）
      - name: Assert GUI tag does not trigger the MCP release workflow
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == gui-v* ]]; then
            if [[ "$REF" == v* ]]; then
              echo "::error::GUI tag '$REF' 命中 MCP release.yml 的 v* 触发器"; exit 1
            fi
            echo "OK: '$REF' 不以 v 开头，不会触发 release.yml（v*），GUI 与 MCP 发版互不干扰"
          else
            echo "非 GUI tag 运行（ref=$REF），跳过隔离断言"
          fi

      - name: Detect whether mcp-gui changed
        id: changed
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/gui-v* ]]; then
            echo "gui_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 手动触发语义 = 「我要现在构建」：无条件构建。
          # 否则 `github.event.before` 为空会退化成比较最近两次提交，若它们恰好未改 mcp-gui/，
          # 整个构建矩阵会被静默跳过（手动触发变成"什么都没跑"）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "gui_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          SHA="${{ github.sha }}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          else
            CHANGED=$(git diff --name-only "$BASE" "$SHA" || true)
          fi
          # gui.yml 自身改动也视为 GUI 变更（与上面的 paths 触发保持一致）
          if echo "$CHANGED" | grep -qE '^(mcp-gui/|\.github/workflows/gui\.yml)'; then
            echo "gui_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gui_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed files:"; echo "$CHANGED"

  build:
    name: Build (${{ matrix.platform }})
    needs: schema-parity
    if: needs.schema-parity.outputs.gui_changed == 'true' || startsWith(github.ref, 'refs/tags/gui-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-15-intel
            platform: darwin-x86_64
          - os: macos-15
            platform: darwin-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-gui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: mcp-gui/src-tauri


      - name: Install frontend dependencies
        working-directory: mcp-gui
        run: npm ci

      - name: Frontend typecheck / lint / unit tests
        working-directory: mcp-gui
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm run test

      # 图标一律从 SVG 派生（仓库规则：不使用 emoji 图标，图标产物不入库）。
      # 用本地已安装的 CLI（npm ci 已装 @tauri-apps/cli），避免再从 registry 拉一份版本不一致的 CLI。
      - name: Generate app icons from assets/tianshu-mcp-icon.svg
        working-directory: mcp-gui
        shell: bash
        run: npx tauri icon ../assets/tianshu-mcp-icon.svg --output src-tauri/icons

      # 公钥未配置时不失败：构建照常，但自动更新不可用（设置面板会明确提示）
      - name: Inject updater public key (optional)
        working-directory: mcp-gui
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ secrets.UPDATER_PUBKEY }}
        run: node scripts/inject-updater-pubkey.mjs "$UPDATER_PUBKEY"


      - name: Rust format / clippy / tests
        working-directory: mcp-gui/src-tauri
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Detect signing capability
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "已配置签名私钥：本次构建将产出可用的更新包"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，本次构建不产出更新包（自动更新暂不可用），但安装包仍会正常产出。"
          fi

      - name: Build app bundle
        working-directory: mcp-gui
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.has }}" = "true" ]; then
            npx tauri build
          else
            # 无密钥时关掉 updater 产物，避免「缺签名」把整个构建拖失败
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Build updater manifest fragment
        if: startsWith(github.ref, 'refs/tags/gui-v') && steps.signing.outputs.has == 'true'
        working-directory: mcp-gui
        shell: bash
        run: |
          node scripts/build-updater-manifest.mjs fragment \
            --platform ${{ matrix.platform }} \
            --bundle-dir src-tauri/target/release/bundle \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            --out src-tauri/target/release/bundle/fragment-${{ matrix.platform }}.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            mcp-gui/src-tauri/target/release/bundle/nsis/*.exe
            mcp-gui/src-tauri/target/release/bundle/nsis/*.zip
            mcp-gui/src-tauri/target/release/bundle/nsis/*.sig
            mcp-gui/src-tauri/target/release/bundle/dmg/*.dmg
            mcp-gui/src-tauri/target/release/bundle/macos/*.tar.gz
            mcp-gui/src-tauri/target/release/bundle/macos/*.sig
            mcp-gui/src-tauri/target/release/bundle/fragment-*.json

  publish:
    name: Publish release (GitHub + Gitee)
    needs: build
    if: startsWith(github.ref, 'refs/tags/gui-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 正式版 / 预发布分流 + 合成发行版正文。
      # 正文取自 docs/release-gui-v<版本>.md 与 .en.md（缺文档时脚本非 0 退出，不产出空壳正文）。
      - name: Decide pre-release and compose release body
        id: meta
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#gui-v}"
          if [[ "$TAG" == *-beta.* || "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "判定为预发布：$TAG"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "判定为正式版：$TAG"
          fi
          node scripts/gui-release-body.mjs "$VER" github "${{ github.repository }}" > "$RUNNER_TEMP/gui-body.md"
          echo "body=$RUNNER_TEMP/gui-body.md" >> "$GITHUB_OUTPUT"
          echo "正文行数：$(wc -l < "$RUNNER_TEMP/gui-body.md")"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files and manifest fragments
        shell: bash
        run: |
          mkdir -p release fragments
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -exec cp -n {} release/ \;
          find artifacts -type f -name 'fragment-*.json' -exec cp -n {} fragments/ \;
          echo "release files:"; ls -la release
          echo "fragments:"; ls -la fragments

      - name: Compose updater manifest (GitHub)
        id: manifest
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#gui-v}"
          if ls fragments/*.json >/dev/null 2>&1; then
            node mcp-gui/scripts/build-updater-manifest.mjs merge \
              --fragments fragments \
              --version "$VER" \
              --notes "Tianshu-mcp 日志台 $VER" \
              --out latest.json
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::没有可用的签名片段，跳过更新清单生成（自动更新暂不可用）"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TITLE="Tianshu-mcp 日志台 $TAG"
          # 幂等重跑：先删掉该 tag 的历史发行版，再以当前构建产物全新创建。
          # 必须按 API 列表删除（而非 `gh release view <tag>`）：tag 被删除时 GitHub 会把已发布
          # 发行版**自动转为 draft**，而 draft 无法按 tag 查到，会残留旧资产（可能属于另一架构）。
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | while read -r id; do
              if [ -n "$id" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
                echo "已删除历史发行版 id=$id"
              fi
            done
          # 预发布标记按 tag 形态决定：正式版不再带 --prerelease。
          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            $PRERELEASE_FLAG \
            --title "$TITLE" \
            --notes-file "${{ steps.meta.outputs.body }}" \
            release/*

      - name: Publish Gitee release with attachments + write Gitee manifest
        if: steps.manifest.outputs.built == 'true'
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#gui-v}"
          FILES=$(ls release/* | paste -sd, -)
          echo "release 目录："; ls -la release
          # 公开仓的 job 日志下载需 admin（403），失败时把原因写成**注解**（公开可读）便于排障
          set +e
          OUT=$(node scripts/gitee-gui-release.mjs \
            --version "$VER" \
            --tag "$TAG" \
            --files "$FILES" \
            --prerelease "${{ steps.meta.outputs.prerelease }}" \
            --body-file "${{ steps.meta.outputs.body }}" \
            --github-manifest latest.json \
            --out-manifest latest-gitee.json 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$CODE" -ne 0 ]; then
            echo "::error::Gitee 发布失败（exit $CODE）：$(printf '%s' "$OUT" | tr '\n' '|' | cut -c1-3000)"
            exit "$CODE"
          fi

      - name: Commit GitHub manifest (update/gui/latest.json)
        if: steps.manifest.outputs.built == 'true'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p update/gui
          cp latest.json update/gui/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/gui/latest.json
          if git diff --cached --quiet; then
            echo "清单无变化，跳过提交"
          else
            # [skip ci]：避免清单提交再触发一次主 CI（GUI 发版与 MCP 发版互不干扰）
            git commit -m "chore(gui): 发布 ${TAG} 并更新更新清单 [skip ci]"
            # 发版期间 master 可能被其它提交推进（本 job 的检出点是启动时的 master），
            # 直接 push 会因 non-fast-forward 被拒并使整条发布流水线失败。
            # 这里失败即拉取最新 master 变基后重推；连续失败才判定为真故障。
            for attempt in 1 2 3; do
              if git push origin HEAD:master; then
                echo "更新清单已推送（第 ${attempt} 次尝试）"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::更新清单推送连续 ${attempt} 次失败，请检查 master 上的并发提交"
                exit 1
              fi
              echo "::warning::推送被拒（master 已前进），拉取最新 master 后重试（第 ${attempt} 次）"
              git fetch origin master
              git rebase origin/master
            done
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Tianshu-mcp 日志台 ${{ github.ref_name }}"
            echo ""
            echo "- 预发布标记：${{ steps.meta.outputs.prerelease }}"
            echo "- GitHub release：已创建"
            echo "- 更新清单生成：${{ steps.manifest.outputs.built }}"
            echo "- Gitee 发行版与附件：见上一步日志"
            echo "- 更新源实测择优：Gitee（中国大陆）/ GitHub（境外，含中国香港、中国台湾）"
          } >> "$GITHUB_STEP_SUMMARY"
